<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 250"><defs>
    <filter id="ink" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency=".04" numOctaves="2" seed="4" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="2.6"/>
    </filter>
    <filter id="wash" x="-25%" y="-25%" width="150%" height="150%">
      <feTurbulence type="fractalNoise" baseFrequency=".011" numOctaves="3" seed="11" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="46" result="d"/>
      <feGaussianBlur in="d" stdDeviation="1.4"/>
    </filter>
    <radialGradient id="peach" cx="50%" cy="46%" r="55%">
      <stop offset="0" stop-color="#ef9f84" stop-opacity=".55"/><stop offset=".72" stop-color="#ef9f84" stop-opacity=".42"/>
      <stop offset="1" stop-color="#e98c70" stop-opacity=".62"/>
    </radialGradient>
    <radialGradient id="butter" cx="50%" cy="50%" r="55%">
      <stop offset="0" stop-color="#f3e7b8" stop-opacity=".75"/><stop offset="1" stop-color="#ecd98f" stop-opacity=".7"/>
    </radialGradient>
    <radialGradient id="olive" r="60%"><stop offset="0" stop-color="#b9c98a" stop-opacity=".55"/><stop offset="1" stop-color="#8aa24f" stop-opacity=".62"/></radialGradient>
    <radialGradient id="dawn" cx="50%" cy="50%" r="55%"><stop offset="0" stop-color="#f3e0a0" stop-opacity=".8"/><stop offset="1" stop-color="#ecbf7a" stop-opacity=".6"/></radialGradient>
    <radialGradient id="star" r="60%"><stop offset="0" stop-color="#2f5f8a" stop-opacity=".6"/><stop offset="1" stop-color="#1d4a66" stop-opacity=".78"/></radialGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#e3c45a" stop-opacity=".92"/><stop offset=".55" stop-color="#ecd98f" stop-opacity=".5"/><stop offset="1" stop-color="#f3e7b8" stop-opacity="0"/></linearGradient>
    <linearGradient id="beam-l" x1="1" y1="0" x2="0" y2="0"><stop offset="0" stop-color="#e3c45a" stop-opacity=".7"/><stop offset=".6" stop-color="#ecd98f" stop-opacity=".35"/><stop offset="1" stop-color="#f3e7b8" stop-opacity="0"/></linearGradient>
    <radialGradient id="atl" r="60%"><stop offset="0" stop-color="#3f7fb0" stop-opacity=".42"/><stop offset="1" stop-color="#2f6e9f" stop-opacity=".55"/></radialGradient>
    <radialGradient id="pol" r="60%"><stop offset="0" stop-color="#63b8a6" stop-opacity=".40"/><stop offset="1" stop-color="#4fa895" stop-opacity=".52"/></radialGradient>
    <radialGradient id="arc" r="60%"><stop offset="0" stop-color="#ef9f84" stop-opacity=".42"/><stop offset="1" stop-color="#e3876b" stop-opacity=".55"/></radialGradient>

    <!-- dark ocean: three water masses as washes, currents in ink, a light rain of dots -->
    <symbol id="m-dark-ocean" viewBox="0 0 480 250">
      <ellipse cx="170" cy="130" rx="150" ry="92" fill="url(#atl)" filter="url(#wash)"/>
      <ellipse cx="318" cy="112" rx="112" ry="74" fill="url(#pol)" filter="url(#wash)"/>
      <ellipse cx="398" cy="178" rx="62" ry="44" fill="url(#arc)" filter="url(#wash)"/>
      <g fill="none" stroke-linecap="round" filter="url(#ink)">
        <path d="M34 150 C 92 118, 150 176, 212 142 S 322 104, 384 136 S 440 160, 458 146" stroke="#1d4a66" stroke-width="1.7"/>
        <path d="M52 176 C 110 150, 168 200, 236 170 S 350 138, 420 166" stroke="#1d4a66" stroke-width="1.2" opacity=".75"/>
        <path d="M76 116 C 128 92, 190 132, 250 108 S 350 76, 408 98" stroke="#c6922c" stroke-width="1.5"/>
      </g>
      <g fill="#33203a" filter="url(#ink)">
        <circle cx="120" cy="58" r="2"/><circle cx="146" cy="44" r="1.4"/><circle cx="178" cy="64" r="1.8"/><circle cx="214" cy="40" r="1.3"/>
        <circle cx="246" cy="58" r="2.2"/><circle cx="292" cy="36" r="1.5"/><circle cx="330" cy="52" r="1.9"/><circle cx="362" cy="34" r="1.3"/>
      </g>
      <g filter="url(#ink)">
        <circle cx="96" cy="210" r="7" fill="#3a82aa" stroke="#1d4a66" stroke-width="2"/>
        <circle cx="428" cy="70" r="5" fill="#3a82aa" stroke="#1d4a66" stroke-width="1.6"/>
      </g>
    </symbol>

    <!-- dark pulsar: a neutron star in ink-blue, its beam sweeping as a butter wash, the averaged pulse profile in ink
         (a sharp peak over a noisy baseline), and the population of the P–Ṗ diagram as dots crowding one corner -->
    <symbol id="m-dark-pulsar" viewBox="0 0 480 250">
      <ellipse cx="262" cy="112" rx="186" ry="78" fill="url(#butter)" filter="url(#wash)" opacity=".55"/>
      <path d="M150 118 L 478 28 L 478 150 Z" fill="url(#beam)" filter="url(#wash)"/>
      <path d="M150 118 L 2 182 L 2 92 Z" fill="url(#beam-l)" filter="url(#wash)"/>
      <ellipse cx="150" cy="118" rx="50" ry="50" fill="url(#star)" filter="url(#wash)"/>
      <ellipse cx="150" cy="118" rx="86" ry="27" fill="none" stroke="#c6922c" stroke-width="1.6" stroke-linecap="round" transform="rotate(-16 150 118)" filter="url(#ink)"/>
      <path d="M28 214 C 58 212, 82 217, 106 212 S 148 216, 178 211 S 222 215, 250 211 C 266 209, 274 158, 284 150 C 292 144, 298 206, 312 212 S 358 215, 386 211 S 432 215, 454 212"
            fill="none" stroke="#33203a" stroke-width="1.7" stroke-linecap="round" filter="url(#ink)"/>
      <g fill="#33203a" filter="url(#ink)">
        <circle cx="300" cy="196" r="1.5"/><circle cx="326" cy="200" r="1.8"/><circle cx="346" cy="192" r="1.3"/><circle cx="366" cy="198" r="2"/>
        <circle cx="384" cy="188" r="1.4"/><circle cx="404" cy="196" r="1.7"/><circle cx="420" cy="184" r="1.3"/><circle cx="440" cy="194" r="1.9"/>
        <circle cx="356" cy="176" r="1.2"/><circle cx="398" cy="172" r="1.4"/><circle cx="430" cy="160" r="1.2"/>
        <circle cx="70" cy="46" r="1.6"/><circle cx="236" cy="38" r="1.3"/><circle cx="392" cy="26" r="1.5"/><circle cx="54" cy="236" r="1.3"/>
      </g>
      <g filter="url(#ink)">
        <circle cx="330" cy="62" r="6" fill="#39b8aa" stroke="#1f6f68" stroke-width="1.8"/>
        <circle cx="412" cy="134" r="4.4" fill="#39b8aa" stroke="#1f6f68" stroke-width="1.5"/>
      </g>
    </symbol>

    <!-- dark re-wilding: the estate as an olive wash with a dawn wash rising over it, three years of an acoustic index
         as one ink line with a summer in each hump, bird detections as ticks crowding the dawns, the water channel below -->
    <symbol id="m-dark-re-wilding" viewBox="0 0 480 250">
      <ellipse cx="236" cy="150" rx="178" ry="76" fill="url(#olive)" filter="url(#wash)"/>
      <ellipse cx="352" cy="78" rx="104" ry="54" fill="url(#dawn)" filter="url(#wash)"/>
      <g fill="none" stroke-linecap="round" filter="url(#ink)">
        <path d="M24 158 C 60 156, 84 110, 118 104 S 162 150, 190 156 S 230 108, 262 102 S 302 150, 332 156 S 372 110, 404 104 S 444 150, 458 154" stroke="#33203a" stroke-width="1.7"/>
        <path d="M30 196 C 80 188, 120 206, 170 196 S 260 186, 310 198 S 400 206, 452 194" stroke="#1d4a66" stroke-width="1.3" opacity=".8"/>
      </g>
      <g stroke="#33203a" stroke-width="1.2" stroke-linecap="round" filter="url(#ink)">
        <path d="M104 92 v8 M112 86 v8 M120 90 v10 M128 94 v6 M136 98 v8"/>
        <path d="M248 90 v8 M256 84 v10 M264 88 v8 M272 92 v8 M280 96 v6 M288 100 v8"/>
        <path d="M392 92 v8 M400 86 v8 M408 90 v10 M416 96 v6"/>
        <path d="M60 134 v5 M78 140 v4 M206 146 v5 M352 142 v5 M440 138 v5"/>
      </g>
      <g fill="#33203a" filter="url(#ink)">
        <circle cx="46" cy="52" r="1.4"/><circle cx="196" cy="40" r="1.6"/><circle cx="314" cy="36" r="1.3"/><circle cx="452" cy="56" r="1.5"/>
        <circle cx="70" cy="232" r="1.3"/><circle cx="420" cy="230" r="1.4"/>
      </g>
      <g filter="url(#ink)">
        <circle cx="262" cy="102" r="6.5" fill="none" stroke="#c6922c" stroke-width="2"/>
        <circle cx="118" cy="104" r="4.2" fill="#f1dc95" stroke="#c6922c" stroke-width="1.5"/>
      </g>
    </symbol>

    <!-- dark sagas (dark_hugur; slug dark-sagas since 2026-10-12): two sagas as narrative lanes in ink, the passages around the cue words as dots in the
         feelings' colours (anger red, the body orange, fear blue, grief violet, laughter yellow, shame and honour olive,
         silence grey, tears teal), one site ringed in gold — the one being read and heard — over a parchment wash -->
    <symbol id="m-dark-sagas" viewBox="0 0 480 250">
      <ellipse cx="242" cy="128" rx="214" ry="88" fill="url(#butter)" filter="url(#wash)" opacity=".6"/>
      <g fill="none" stroke="#33203a" stroke-linecap="round" filter="url(#ink)">
        <path d="M28 96 C 74 92, 118 100, 164 95 S 254 90, 300 96 S 392 103, 452 94" stroke-width="1.6"/>
        <path d="M28 172 C 80 168, 126 176, 176 170 S 262 166, 310 173 S 398 178, 452 169" stroke-width="1.6"/>
      </g>
      <g filter="url(#ink)">
        <circle cx="52" cy="95" r="3.2" fill="#d9534f"/><circle cx="78" cy="98" r="2.2" fill="#e2893b"/><circle cx="104" cy="94" r="4.6" fill="#d9534f"/>
        <circle cx="140" cy="97" r="2.8" fill="#4f7fc8"/><circle cx="172" cy="94" r="3.6" fill="#e6c04b"/><circle cx="198" cy="92" r="2.4" fill="#8d8f98"/>
        <circle cx="230" cy="93" r="5.2" fill="#9aa84e"/><circle cx="262" cy="96" r="2.6" fill="#8a6bd1"/><circle cx="296" cy="95" r="3.4" fill="#d9534f"/>
        <circle cx="330" cy="99" r="2.3" fill="#39b8aa"/><circle cx="366" cy="101" r="4.1" fill="#e6c04b"/><circle cx="404" cy="97" r="2.7" fill="#4f7fc8"/><circle cx="438" cy="95" r="3.3" fill="#9aa84e"/>
        <circle cx="46" cy="171" r="2.6" fill="#8a6bd1"/><circle cx="84" cy="170" r="4.4" fill="#d9534f"/><circle cx="118" cy="174" r="2.1" fill="#8d8f98"/>
        <circle cx="152" cy="171" r="3.5" fill="#e6c04b"/><circle cx="190" cy="168" r="2.9" fill="#39b8aa"/><circle cx="224" cy="170" r="5.6" fill="#d9534f"/>
        <circle cx="258" cy="173" r="2.4" fill="#e2893b"/><circle cx="290" cy="171" r="3.9" fill="#9aa84e"/><circle cx="328" cy="175" r="2.5" fill="#4f7fc8"/>
        <circle cx="362" cy="176" r="4.6" fill="#e6c04b"/><circle cx="398" cy="174" r="2.2" fill="#8a6bd1"/><circle cx="432" cy="171" r="3.1" fill="#39b8aa"/>
      </g>
      <g filter="url(#ink)">
        <circle cx="224" cy="170" r="10.5" fill="none" stroke="#c6922c" stroke-width="2"/>
      </g>
      <g fill="#33203a" filter="url(#ink)" opacity=".85">
        <circle cx="60" cy="226" r="1.3"/><circle cx="92" cy="228" r="1.6"/><circle cx="130" cy="225" r="1.2"/><circle cx="164" cy="229" r="1.8"/>
        <circle cx="206" cy="226" r="1.3"/><circle cx="246" cy="228" r="1.5"/><circle cx="288" cy="225" r="1.9"/><circle cx="326" cy="229" r="1.2"/>
        <circle cx="362" cy="226" r="1.6"/><circle cx="400" cy="228" r="1.3"/><circle cx="436" cy="225" r="1.7"/>
        <circle cx="84" cy="40" r="1.4"/><circle cx="238" cy="34" r="1.2"/><circle cx="392" cy="42" r="1.5"/>
      </g>
    </symbol>

    <!-- any design without its own motif: an orbit and a field of stars -->
    <symbol id="m-default" viewBox="0 0 480 250">
      <ellipse cx="250" cy="130" rx="150" ry="94" fill="url(#butter)" filter="url(#wash)"/>
      <path d="M140 150 C 170 70, 330 60, 360 130 S 270 220, 200 170 S 260 80, 330 110" fill="none" stroke="#c6922c" stroke-width="1.5" stroke-linecap="round" filter="url(#ink)"/>
      <g fill="#33203a" filter="url(#ink)"><circle cx="120" cy="60" r="2"/><circle cx="380" cy="70" r="1.6"/><circle cx="410" cy="180" r="2"/><circle cx="96" cy="190" r="1.5"/></g>
    </symbol>
  </defs>
      <ellipse cx="236" cy="150" rx="178" ry="76" fill="url(#olive)" filter="url(#wash)"/>
      <ellipse cx="352" cy="78" rx="104" ry="54" fill="url(#dawn)" filter="url(#wash)"/>
      <g fill="none" stroke-linecap="round" filter="url(#ink)">
        <path d="M24 158 C 60 156, 84 110, 118 104 S 162 150, 190 156 S 230 108, 262 102 S 302 150, 332 156 S 372 110, 404 104 S 444 150, 458 154" stroke="#33203a" stroke-width="1.7"/>
        <path d="M30 196 C 80 188, 120 206, 170 196 S 260 186, 310 198 S 400 206, 452 194" stroke="#1d4a66" stroke-width="1.3" opacity=".8"/>
      </g>
      <g stroke="#33203a" stroke-width="1.2" stroke-linecap="round" filter="url(#ink)">
        <path d="M104 92 v8 M112 86 v8 M120 90 v10 M128 94 v6 M136 98 v8"/>
        <path d="M248 90 v8 M256 84 v10 M264 88 v8 M272 92 v8 M280 96 v6 M288 100 v8"/>
        <path d="M392 92 v8 M400 86 v8 M408 90 v10 M416 96 v6"/>
        <path d="M60 134 v5 M78 140 v4 M206 146 v5 M352 142 v5 M440 138 v5"/>
      </g>
      <g fill="#33203a" filter="url(#ink)">
        <circle cx="46" cy="52" r="1.4"/><circle cx="196" cy="40" r="1.6"/><circle cx="314" cy="36" r="1.3"/><circle cx="452" cy="56" r="1.5"/>
        <circle cx="70" cy="232" r="1.3"/><circle cx="420" cy="230" r="1.4"/>
      </g>
      <g filter="url(#ink)">
        <circle cx="262" cy="102" r="6.5" fill="none" stroke="#c6922c" stroke-width="2"/>
        <circle cx="118" cy="104" r="4.2" fill="#f1dc95" stroke="#c6922c" stroke-width="1.5"/>
      </g>
    </svg>
